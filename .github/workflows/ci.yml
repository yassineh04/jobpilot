name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Tests (SQLite)
        working-directory: backend
        env:
          SECRET_KEY: test_secret
        run: pytest -v

      - name: Tests (PostgreSQL)
        working-directory: backend
        env:
          SECRET_KEY: test_secret
          TEST_DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker_db
        run: pytest -q

      - name: Migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker_db
        run: alembic upgrade head && alembic downgrade 0005 && alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, lint & build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t job-tracker-backend ./backend
      - name: Build frontend image
        run: docker build -t job-tracker-frontend ./frontend
